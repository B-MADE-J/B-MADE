<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ff">
  <title>KEYCAP PLAYGROUND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #29243b;
      --muted: #817b91;
      --accent: #8c75f5;
      --accent-dark: #7159df;
      --surface: rgba(255,255,255,.82);
      --line: rgba(90,75,130,.12);
      --shadow: 0 22px 60px rgba(65,48,112,.13);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      padding: 28px 18px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: 'Pretendard', sans-serif;
      background: #f7f4ff;
    }

    #background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 1;
      pointer-events: none;
    }

    .app {
      width: min(100%, 760px);
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent-dark);
      font: 22px 'Jua', sans-serif;
      letter-spacing: .3px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #eeeaff;
      box-shadow: inset 0 0 0 1px rgba(140,117,245,.12);
    }

    .sound-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: #fff;
      font: 600 13px 'Pretendard', sans-serif;
      cursor: pointer;
      transition: .2s ease;
    }
    .sound-button:hover { transform: translateY(-2px); border-color: #c9bfff; }
    .sound-button[aria-pressed="true"] { color: var(--accent-dark); background: #f0edff; }

    h1 {
      margin-bottom: 9px;
      font: clamp(30px, 6vw, 43px) 'Jua', sans-serif;
      letter-spacing: -.6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .counter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 25px auto 4px;
      padding: 12px 20px;
      border: 1px solid rgba(140,117,245,.15);
      border-radius: 18px;
      background: linear-gradient(135deg, #f3f0ff, #fff1f8);
    }
    .counter-label { color: var(--muted); font-size: 13px; font-weight: 600; }
    #count { color: var(--accent-dark); font: 25px 'Jua', sans-serif; font-variant-numeric: tabular-nums; }

    .slider {
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 24px;
      touch-action: pan-y;
    }
    .pages {
      display: flex;
      transition: transform .42s cubic-bezier(.22,.8,.25,1);
      will-change: transform;
    }
    .page {
      position: relative;
      display: flex;
      flex: 0 0 100%;
      min-width: 100%;
      height: clamp(270px, 48vw, 390px);
      align-items: center;
      justify-content: center;
    }
    .key {
      position: relative;
      display: flex;
      width: min( min(70vw, 330px), 330px);
      height: min( min(70vw, 330px), 330px);
      align-items: center;
      justify-content: center;
      overflow: visible;
      border-radius: 34px;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease;
      user-select: none;
    }
    .key img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      transform: scale(1.9);
      filter: drop-shadow(0 20px 15px rgba(43,34,74,.15));
    }
    .key.key23 img { transform: scale(1.45); }
    .key.pressed { transform: translateY(8px) scale(.97); }
    .key:focus-visible { outline: 3px solid var(--accent); outline-offset: 12px; }

    .particle {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      transform-origin: center;
    }

    .navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 4px;
    }
    .nav-arrow {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: #fff;
      font-size: 19px;
      cursor: pointer;
      transition: .2s ease;
    }
    .nav-arrow:hover:not(:disabled) { color: var(--accent-dark); transform: translateY(-2px); }
    .nav-arrow:disabled { opacity: .35; cursor: default; }
    .dots { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 20px;
      background: #d9d4e8;
      cursor: pointer;
      transition: .25s ease;
    }
    .dot.active { width: 23px; background: var(--accent); }

    .hint {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .footer {
      margin-top: 28px;
      color: #aaa4b7;
      font-size: 11px;
      letter-spacing: .5px;
    }

    @media (max-width: 520px) {
      body { padding: 14px 12px 22px; }
      .app { padding: 22px 14px 25px; border-radius: 25px; }
      .topline { margin-bottom: 23px; }
      .brand { font-size: 19px; }
      .sound-button { min-height: 36px; padding: 0 11px; font-size: 12px; }
      .page { height: 300px; }
      .key { width: min(75vw, 285px); height: min(75vw, 285px); }
      .key img { transform: scale(1.7); }
      .key.key23 img { transform: scale(1.35); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="background" aria-hidden="true"></div>

  <main class="app">
    <header class="topline">
      <div class="brand"><span class="brand-mark">⌨</span> KEYCAP PLAY</div>
      <button class="sound-button" id="soundButton" type="button" aria-pressed="false">
        <span id="soundIcon">♫</span><span id="soundText">배경음악 켜기</span>
      </button>
    </header>

    <section>
      <h1>오늘의 키캡 놀이터</h1>
      <p class="subtitle">마음에 드는 키캡을 톡톡 눌러보세요!</p>

      <div class="counter" aria-live="polite">
        <span class="counter-label">TOTAL HITS</span>
        <span id="count">0</span>
      </div>
    </section>

    <section class="slider" aria-label="키캡 선택">
      <div class="pages">
        <div class="page">
          <div class="key" data-key="1" role="button" tabindex="0" aria-label="첫 번째 키캡">
            <img src="https://hakgeo212543-hub.github.io/keycap2/spike.png" alt="스파이크 키캡">
          </div>
        </div>
        <div class="page">
          <div class="key key23" data-key="2" data-animation="2" role="button" tabindex="0" aria-label="두 번째 천사 키캡">
            <img src="https://hakgeo212543-hub.github.io/keycap2/angel_01_535x466.png" alt="천사 키캡">
          </div>
        </div>
        <div class="page">
          <div class="key key23" data-key="3" data-animation="3" role="button" tabindex="0" aria-label="세 번째 악마 키캡">
            <img src="https://hakgeo212543-hub.github.io/keycap2/devil_01_535x466.png" alt="악마 키캡">
          </div>
        </div>
      </div>
    </section>

    <nav class="navigation" aria-label="키캡 페이지 이동">
      <button class="nav-arrow" id="prevButton" type="button" aria-label="이전 키캡">‹</button>
      <div class="dots">
        <button class="dot active" type="button" aria-label="첫 번째 키캡" data-page="0"></button>
        <button class="dot" type="button" aria-label="두 번째 키캡" data-page="1"></button>
        <button class="dot" type="button" aria-label="세 번째 키캡" data-page="2"></button>
      </div>
      <button class="nav-arrow" id="nextButton" type="button" aria-label="다음 키캡">›</button>
    </nav>

    <p class="hint">키캡을 누르거나 좌우로 밀어서 다른 키캡을 만나보세요</p>
    <footer class="footer">A LITTLE KEYCAP, A LOT OF FUN ✦</footer>
  </main>

  <script>
    const GITHUB = "https://hakgeo212543-hub.github.io/keycap2";
    const bgm = new Audio(`${GITHUB}/bgm.mp3`);
    const crack = new Audio(`${GITHUB}/cr.mp3`);
    const clickSound = new Audio(`${GITHUB}/click_s.wav`);
    bgm.loop = true;
    let bgmOn = false;
    let total = 0;
    let currentPage = 0;
    let activePointers = new Set();

    const pages = document.querySelector(".pages");
    const background = document.getElementById("background");
    const count = document.getElementById("count");
    const backgrounds = [`${GITHUB}/r_b.png`, `${GITHUB}/b_r.png`, `${GITHUB}/r_b.png`];

    const animations = {
      2: Array.from({length: 6}, (_, i) => `${GITHUB}/angel_0${i + 1}_535x466.png`),
      3: Array.from({length: 6}, (_, i) => `${GITHUB}/devil_0${i + 1}_535x466.png`)
    };

    function updatePage() {
      pages.style.transform = `translateX(-${currentPage * 100}%)`;
      background.style.backgroundImage = `url("${backgrounds[currentPage]}")`;
      document.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === currentPage);
        dot.setAttribute("aria-current", i === currentPage ? "page" : "false");
      });
      document.getElementById("prevButton").disabled = currentPage === 0;
      document.getElementById("nextButton").disabled = currentPage === 2;
    }

    function goToPage(page) {
      currentPage = Math.max(0, Math.min(2, page));
      updatePage();
    }

    document.getElementById("prevButton").addEventListener("click", () => goToPage(currentPage - 1));
    document.getElementById("nextButton").addEventListener("click", () => goToPage(currentPage + 1));
    document.querySelectorAll(".dot").forEach(dot => {
      dot.addEventListener("click", () => goToPage(Number(dot.dataset.page)));
    });

    document.getElementById("soundButton").addEventListener("click", async () => {
      const button = document.getElementById("soundButton");
      try {
        if (!bgmOn) {
          await bgm.play();
          bgmOn = true;
        } else {
          bgm.pause();
          bgmOn = false;
        }
        button.setAttribute("aria-pressed", String(bgmOn));
        document.getElementById("soundIcon").textContent = bgmOn ? "♫" : "♪";
        document.getElementById("soundText").textContent = bgmOn ? "배경음악 끄기" : "배경음악 켜기";
      } catch (error) {
        console.warn("배경음악을 재생할 수 없습니다.", error);
      }
    });

    function playKeyAnimation(key) {
      const animationNumber = key.dataset.animation;
      if (!animationNumber) return;
      const frames = animations[animationNumber];
      const img = key.querySelector("img");
      let frame = 0;
      key.animationPlaying = true;
      clearTimeout(key.animationTimer);

      function nextFrame() {
        if (!key.animationPlaying) return;
        img.src = frames[frame];
        frame += 1;
        if (frame < frames.length) key.animationTimer = setTimeout(nextFrame, 80);
      }
      nextFrame();
    }

    function stopKeyAnimation(key) {
      key.animationPlaying = false;
      clearTimeout(key.animationTimer);
      const frames = animations[key.dataset.animation];
      if (frames) key.querySelector("img").src = frames[0];
      key.classList.remove("pressed");
    }

    function playClickSound() {
      const sound = clickSound.cloneNode();
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function spawnParticle(key) {
      const particle = document.createElement("img");
      particle.className = "particle";
      particle.src = `${GITHUB}/blood.png`;
      const size = 8 + Math.random() * 18;
      let x = key.clientWidth / 2 - size / 2;
      let y = key.clientHeight / 2 - size / 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      key.appendChild(particle);

      const angle = (-120 + Math.random() * 60) * Math.PI / 180;
      let vx = Math.cos(angle) * (10 + Math.random() * 8);
      let vy = Math.sin(angle) * (10 + Math.random() * 8);
      const gravity = .65;

      function update() {
        x += vx;
        y += vy;
        vy += gravity;
        particle.style.transform = `translate(${x - (key.clientWidth / 2 - size / 2)}px, ${y - (key.clientHeight / 2 - size / 2)}px) rotate(${Math.atan2(vy, vx) * 180 / Math.PI - 90}deg)`;
        particle.style.opacity = String(Math.max(0, 1 - y / 600));
        if (y < 700 && x > -300 && x < 700) requestAnimationFrame(update);
        else particle.remove();
      }
      requestAnimationFrame(update);
    }

    function pressKey(key) {
      if (key.dataset.isPressed === "true") return;
      key.dataset.isPressed = "true";
      total += 1;
      count.textContent = total.toLocaleString("ko-KR");
      key.classList.add("pressed");
      playKeyAnimation(key);

      if (key.dataset.key === "1") {
        spawnParticle(key);
        playClickSound();
      } else {
        crack.currentTime = 0;
        crack.play().catch(() => {});
      }
    }

    function releaseKey(key) {
      if (key.dataset.isPressed !== "true") return;
      key.dataset.isPressed = "false";
      stopKeyAnimation(key);
      crack.pause();
      crack.currentTime = 0;
    }

    document.querySelectorAll(".key").forEach(key => {
      key.addEventListener("pointerdown", event => {
        event.preventDefault();
        key.setPointerCapture?.(event.pointerId);
        activePointers.add(event.pointerId);
        pressKey(key);
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
        key.addEventListener(type, event => {
          activePointers.delete(event.pointerId);
          releaseKey(key);
        });
      });
      key.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          pressKey(key);
        }
      });
      key.addEventListener("keyup", event => {
        if (event.key === "Enter" || event.key === " ") releaseKey(key);
      });
      key.addEventListener("blur", () => releaseKey(key));
    });

    let swipeStart = null;
    const slider = document.querySelector(".slider");
    slider.addEventListener("pointerdown", event => {
      if (event.target.closest(".key")) return;
      swipeStart = {x: event.clientX, y: event.clientY};
    });
    slider.addEventListener("pointerup", event => {
      if (!swipeStart || event.target.closest(".key")) return;
      const dx = event.clientX - swipeStart.x;
      const dy = event.clientY - swipeStart.y;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
        goToPage(currentPage + (dx < 0 ? 1 : -1));
      }
      swipeStart = null;
    });
    slider.addEventListener("pointercancel", () => { swipeStart = null; });

    updatePage();
  </script>
</body>
</html>
